<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Team Task Board</title>
<style>
  /* 🎨 VARIABILI TEMA - Dark (default) */
  :root {
    --bg-body: #0a1929;
    --bg-header-border: #1976d2;
    --bg-category: #132f4c;
    --bg-task: #1e3a5f;
    --bg-task-hover: #244b7a;
    --bg-summary-card: #132f4c;
    --border-category: #1e4976;
    --text-primary: #fff;
    --text-secondary: #90caf9;
    --text-accent: #64b5f6;
    --text-heading: #64b5f6;
    --shadow-color: rgba(0,0,0,0.3);
    --btn-bg: rgba(255,255,255,0.1);
    --btn-hover: rgba(255,255,255,0.25);
    --footer-color: rgba(144, 202, 249, 0.4);
    --dive-deep-bg: linear-gradient(90deg, #b71c1c 0%, #d32f2f 100%);
    --dive-deep-text: #fff;
  }

  /* ☀️ VARIABILI TEMA - Light */
  body.light-mode {
    --bg-body: #f5f7fa;
    --bg-header-border: #1976d2;
    --bg-category: #ffffff;
    --bg-task: #f0f4f8;
    --bg-task-hover: #e3f2fd;
    --bg-summary-card: #ffffff;
    --border-category: #e0e0e0;
    --text-primary: #263238;
    --text-secondary: #546e7a;
    --text-accent: #1976d2;
    --text-heading: #1565c0;
    --shadow-color: rgba(0,0,0,0.1);
    --btn-bg: rgba(0,0,0,0.05);
    --btn-hover: rgba(0,0,0,0.15);
    --footer-color: rgba(84, 110, 122, 0.5);
    --dive-deep-bg: linear-gradient(90deg, #d32f2f 0%, #ef5350 100%);
    --dive-deep-text: #fff;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg-body);
    color: var(--text-primary);
    font-family: 'Segoe UI', sans-serif;
    padding: 20px;
    min-height: 100vh;
    transition: background 0.3s, color 0.3s;
  }

  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 2px solid var(--bg-header-border);
    padding-bottom: 15px;
    margin-bottom: 20px;
  }
  h1 { font-size: 2.5em; }

  .header-right {
    display: flex;
    align-items: center;
    gap: 20px;
  }

  .theme-toggle {
    background: var(--btn-bg);
    border: none;
    color: var(--text-primary);
    width: 50px;
    height: 50px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 1.8em;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s ease;
  }
  .theme-toggle:hover {
    background: var(--btn-hover);
    transform: rotate(15deg) scale(1.1);
  }

  .datetime-container { text-align: right; }
  #clock { 
    font-size: 2em; 
    color: var(--text-accent); 
    font-weight: bold;
  }
  #date { 
    font-size: 1.1em; 
    color: var(--text-secondary); 
    margin-top: 4px;
  }

  /* 📅 Week Bar - LAYOUT A 3 SEZIONI */
  .week-bar {
    background: linear-gradient(90deg, #1976d2 0%, #64b5f6 100%);
    color: white;
    padding: 14px 24px;
    border-radius: 10px;
    margin-bottom: 15px;
    display: grid;
    grid-template-columns: auto 1fr auto;
    gap: 20px;
    align-items: center;
    box-shadow: 0 4px 14px rgba(25, 118, 210, 0.35);
  }

  .week-bar-section-left {
    display: flex;
    align-items: center;
    gap: 15px;
  }

  .week-number {
    font-size: 2em;
    font-weight: bold;
    color: #fff;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
    white-space: nowrap;
  }

  .week-range {
    font-size: 0.95em;
    color: #e3f2fd;
    background: rgba(255,255,255,0.18);
    padding: 6px 14px;
    border-radius: 20px;
    white-space: nowrap;
    font-weight: 600;
  }

  /* 📊 Mini-cards nella Week Bar */
  .week-bar-stats {
    display: flex;
    gap: 12px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .stat-chip {
    background: rgba(255,255,255,0.18);
    padding: 8px 16px;
    border-radius: 25px;
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 600;
    backdrop-filter: blur(10px);
    transition: all 0.2s;
  }
  .stat-chip:hover {
    background: rgba(255,255,255,0.28);
    transform: translateY(-2px);
  }
  .stat-chip-count {
    font-size: 1.4em;
    font-weight: bold;
    color: #fff;
  }
  .stat-chip-label {
    font-size: 0.9em;
    color: #e3f2fd;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  /* 🔴 Banda Dive Deep - Scadute WK Precedente */
  .dive-deep-bar {
    background: var(--dive-deep-bg);
    color: var(--dive-deep-text);
    padding: 12px 20px;
    border-radius: 8px;
    margin-bottom: 20px;
    box-shadow: 0 4px 12px rgba(211, 47, 47, 0.4);
    animation: dive-deep-pulse 3s infinite;
    display: none; /* Nascosta di default */
  }
  .dive-deep-bar.visible {
    display: block;
  }

  @keyframes dive-deep-pulse {
    0%, 100% { box-shadow: 0 4px 12px rgba(211, 47, 47, 0.4); }
    50% { box-shadow: 0 4px 20px rgba(211, 47, 47, 0.7); }
  }

  .dive-deep-title {
    font-weight: bold;
    font-size: 1.05em;
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .dive-deep-tasks {
    font-size: 0.95em;
    line-height: 1.5;
  }

  .dive-deep-task-item {
    display: inline-block;
    background: rgba(255,255,255,0.2);
    padding: 4px 12px;
    margin: 3px 4px 3px 0;
    border-radius: 15px;
    font-weight: 600;
  }
  .dive-deep-task-item .owner {
    opacity: 0.85;
    font-weight: normal;
    font-size: 0.9em;
    margin-left: 4px;
  }

  .board {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    gap: 20px;
    margin-bottom: 60px;
  }
  .category {
    background: var(--bg-category);
    border-radius: 12px;
    padding: 20px;
    box-shadow: 0 4px 12px var(--shadow-color);
  }
  .category h2 {
    color: var(--text-heading);
    margin-bottom: 15px;
    border-bottom: 1px solid var(--border-category);
    padding-bottom: 8px;
  }

  .task {
    background: var(--bg-task);
    border-left: 4px solid var(--text-accent);
    padding: 12px;
    margin-bottom: 10px;
    border-radius: 6px;
    transition: all 0.3s;
    display: flex;
    align-items: center;
    gap: 10px;
    position: relative;
  }
  .task:hover { 
    background: var(--bg-task-hover); 
    transform: translateX(3px); 
  }

  .task.done {
    opacity: 0.5;
    text-decoration: line-through;
    border-left-color: #4caf50 !important;
  }

  .task.scaduta {
    background: linear-gradient(135deg, #4a0e0e 0%, var(--bg-task) 100%);
    border-left-color: #d32f2f !important;
    animation: pulse-red 2s infinite;
  }
  body.light-mode .task.scaduta {
    background: linear-gradient(135deg, #ffcdd2 0%, var(--bg-task) 100%);
  }

  .task.imminente {
    background: linear-gradient(135deg, #4a3a0e 0%, var(--bg-task) 100%);
    border-left-color: #ffa726 !important;
  }
  body.light-mode .task.imminente {
    background: linear-gradient(135deg, #fff3e0 0%, var(--bg-task) 100%);
  }

  .task.oggi {
    background: linear-gradient(135deg, #4a2a0e 0%, var(--bg-task) 100%);
    border-left-color: #ff5722 !important;
    animation: pulse-orange 3s infinite;
  }
  body.light-mode .task.oggi {
    background: linear-gradient(135deg, #ffe0b2 0%, var(--bg-task) 100%);
  }

  @keyframes pulse-red {
    0%, 100% { box-shadow: 0 0 5px rgba(211, 47, 47, 0.5); }
    50% { box-shadow: 0 0 20px rgba(211, 47, 47, 0.9); }
  }
  @keyframes pulse-orange {
    0%, 100% { box-shadow: 0 0 5px rgba(255, 87, 34, 0.4); }
    50% { box-shadow: 0 0 15px rgba(255, 87, 34, 0.7); }
  }

  .task-info { flex: 1; }
  .task-meta { 
    font-size: 0.85em; 
    color: var(--text-secondary); 
    margin-top: 4px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
  }

  .due-badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 12px;
    font-size: 0.85em;
    font-weight: bold;
    margin-left: 4px;
  }
  .due-badge.normale { background: #37474f; color: #b0bec5; }
  body.light-mode .due-badge.normale { background: #cfd8dc; color: #37474f; }

  .due-badge.imminente { background: #ffa726; color: #000; }
  .due-badge.oggi { background: #ff5722; color: #fff; }
  .due-badge.scaduta { background: #d32f2f; color: #fff; }

  .cadenza-badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 12px;
    font-size: 0.85em;
    font-weight: bold;
    background: #5c6bc0;
    color: #fff;
  }
  .cadenza-badge.weekly { background: #26a69a; }
  .cadenza-badge.monthly { background: #7e57c2; }
  .cadenza-badge.biweekly { background: #ec407a; }
  .cadenza-badge.daily { background: #ef5350; }
  .cadenza-badge.quarterly { background: #66bb6a; }
  .cadenza-badge.yearly { background: #ff7043; }

  .checkbox { width: 22px; height: 22px; cursor: pointer; }
  .checkbox:disabled { cursor: wait; opacity: 0.5; }
  #status { color: #f44336; margin: 20px 0; }
  .loading { text-align: center; padding: 40px; color: var(--text-accent); }
  .saving-indicator {
    display: inline-block;
    margin-left: 8px;
    color: #ff9800;
    font-size: 0.75em;
    font-style: italic;
  }

  /* Alert cards (solo scadute/oggi/imminenti) */
  .alerts {
    display: flex;
    gap: 15px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }
  .alert-card {
    background: var(--bg-summary-card);
    padding: 10px 20px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 0.95em;
    box-shadow: 0 2px 6px var(--shadow-color);
  }
  .alert-card.critical { border-left: 4px solid #d32f2f; }
  .alert-card.warning { border-left: 4px solid #ffa726; }
  .alert-count { font-size: 1.5em; font-weight: bold; }

  .author-signature {
    position: fixed;
    bottom: 12px;
    right: 18px;
    font-size: 0.8em;
    color: var(--footer-color);
    font-style: italic;
    letter-spacing: 0.5px;
    pointer-events: none;
    user-select: none;
    transition: color 0.3s;
    z-index: 100;
  }

  /* Responsive */
  @media (max-width: 900px) {
    .week-bar {
      grid-template-columns: 1fr;
      text-align: center;
    }
    .week-bar-section-left {
      justify-content: center;
    }
  }
</style>
</head>
<body>

<header>
  <h1>📋 Team Task Board</h1>
  <div class="header-right">
    <div class="datetime-container">
      <div id="clock">--:--:--</div>
      <div id="date">-- ------ ----</div>
    </div>
    <button class="theme-toggle" id="themeToggle" title="Cambia tema">🌙</button>
  </div>
</header>

<!-- 📅 Week Bar con stats integrate -->
<div class="week-bar">
  <div class="week-bar-section-left">
    <span class="week-number" id="weekNumber">--</span>
  </div>
  <div class="week-bar-stats" id="weekStats">
    <div class="stat-chip">
      <span class="stat-chip-count" id="statAperte">--</span>
      <span class="stat-chip-label">📋 Aperte</span>
    </div>
    <div class="stat-chip">
      <span class="stat-chip-count" id="statCompletate">--</span>
      <span class="stat-chip-label">✅ Completate</span>
    </div>
  </div>
  <span class="week-range" id="weekRange">Caricamento...</span>
</div>

<!-- 🔴 Banda Dive Deep (visibile solo se ci sono scadute WK precedente) -->
<div class="dive-deep-bar" id="diveDeepBar">
  <div class="dive-deep-title" id="diveDeepTitle">⚠️ Dive Deep WK --:</div>
  <div class="dive-deep-tasks" id="diveDeepTasks"></div>
</div>

<!-- 🚨 Alert Cards (scadute/oggi/imminenti) -->
<div id="alerts" class="alerts"></div>

<div id="status"></div>
<div id="board" class="board">
  <div class="loading">⏳ Caricamento tasks...</div>
</div>

<!-- 🏷️ Firma Autore -->
<div class="author-signature">Versione 2.0 by mmantone</div>

<script>
  const API_URL = 'https://script.google.com/macros/s/AKfycbzWplByZ9asXeAMKzQyak1IG3kIaGQ5ukxbFwOeUwBIZWaz9hZA0LMEB-8NPCRnlSnzZg/exec';

  const AUTO_REFRESH_MS = 30000;
  const GIORNI_IMMINENTE = 3;
  const GIORNI_OGGI = 1;

  const WEEK_REFERENCE_DATE = new Date(2026, 8, 27);
  const WEEK_REFERENCE_NUMBER = 40;

  let isUpdating = false;

  // 🌓 GESTIONE TEMA
  function initTheme() {
    const savedTheme = localStorage.getItem('theme') || 'dark';
    applyTheme(savedTheme);
    document.getElementById('themeToggle').addEventListener('click', toggleTheme);
  }

  function toggleTheme() {
    const currentTheme = document.body.classList.contains('light-mode') ? 'light' : 'dark';
    const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
    applyTheme(newTheme);
  }

  function applyTheme(theme) {
    const btn = document.getElementById('themeToggle');
    if (theme === 'light') {
      document.body.classList.add('light-mode');
      btn.textContent = '☀️';
      btn.title = 'Passa alla modalità scura';
    } else {
      document.body.classList.remove('light-mode');
      btn.textContent = '🌙';
      btn.title = 'Passa alla modalità chiara';
    }
    localStorage.setItem('theme', theme);
  }

  // 📅 Calcola numero settimana
  function getWeekNumber(date) {
    const target = new Date(date.valueOf());
    target.setHours(0, 0, 0, 0);

    const reference = new Date(WEEK_REFERENCE_DATE.valueOf());
    reference.setHours(0, 0, 0, 0);

    const diffMs = target - reference;
    const diffDays = Math.round(diffMs / (1000 * 60 * 60 * 24));

    const dayOfWeek = target.getDay();
    const daysToSundayOfTarget = diffDays - dayOfWeek;
    const weeksDiff = Math.floor(daysToSundayOfTarget / 7);

    return WEEK_REFERENCE_NUMBER + weeksDiff;
  }

  // 📅 Range settimana corrente (domenica → sabato)
  function getWeekRange(date) {
    const current = new Date(date.valueOf());
    current.setHours(0, 0, 0, 0);

    const dayOfWeek = current.getDay();

    const sunday = new Date(current);
    sunday.setDate(current.getDate() - dayOfWeek);

    const saturday = new Date(sunday);
    saturday.setDate(sunday.getDate() + 6);

    const format = (d) => {
      const day = String(d.getDate()).padStart(2, '0');
      const month = String(d.getMonth() + 1).padStart(2, '0');
      return `${day}-${month}`;
    };

    return `${format(sunday)} → ${format(saturday)}`;
  }

  // 🔙 Range WK precedente (restituisce oggetto con start/end Date e numero WK)
  function getPreviousWeekBounds(date) {
    const current = new Date(date.valueOf());
    current.setHours(0, 0, 0, 0);

    const dayOfWeek = current.getDay();

    // Domenica della settimana corrente
    const currentSunday = new Date(current);
    currentSunday.setDate(current.getDate() - dayOfWeek);

    // Domenica settimana precedente
    const prevSunday = new Date(currentSunday);
    prevSunday.setDate(currentSunday.getDate() - 7);
    prevSunday.setHours(0, 0, 0, 0);

    // Sabato settimana precedente
    const prevSaturday = new Date(prevSunday);
    prevSaturday.setDate(prevSunday.getDate() + 6);
    prevSaturday.setHours(23, 59, 59, 999);

    const prevWeekNum = getWeekNumber(prevSunday);

    return {
      start: prevSunday,
      end: prevSaturday,
      weekNum: prevWeekNum
    };
  }

  function updateDateTime() {
    const now = new Date();

    document.getElementById('clock').textContent = 
      now.toLocaleTimeString('it-IT');

    document.getElementById('date').textContent = 
      now.toLocaleDateString('it-IT', { 
        weekday: 'long', 
        day: 'numeric', 
        month: 'long', 
        year: 'numeric' 
      });

    const weekNum = getWeekNumber(now);
    const weekRange = getWeekRange(now);
    document.getElementById('weekNumber').textContent = 'WK ' + weekNum;
    document.getElementById('weekRange').textContent = weekRange;
  }
  setInterval(updateDateTime, 1000);
  updateDateTime();

  function getCadenzaClass(cadenza) {
    if (!cadenza) return '';
    const normalized = String(cadenza).toLowerCase().trim();

    if (normalized === 'weekly') return 'weekly';
    if (normalized === 'monthly') return 'monthly';
    if (normalized === 'bi-weekly' || normalized === 'biweekly') return 'biweekly';
    if (normalized === 'daily') return 'daily';
    if (normalized === 'quarterly') return 'quarterly';
    if (normalized === 'yearly' || normalized === 'annual') return 'yearly';
    return '';
  }

  function formatDataDDMM(dataString) {
    if (!dataString) return '';
    const data = new Date(dataString);
    if (isNaN(data.getTime())) return '';

    const giorno = String(data.getDate()).padStart(2, '0');
    const mese = String(data.getMonth() + 1).padStart(2, '0');
    return `${giorno}-${mese}`;
  }

  function calcolaGiorniMancanti(scadenza) {
    if (!scadenza) return null;

    const dataScadenza = new Date(scadenza);
    if (isNaN(dataScadenza.getTime())) return null;

    const oggi = new Date();
    oggi.setHours(0, 0, 0, 0);
    dataScadenza.setHours(0, 0, 0, 0);

    const diffMs = dataScadenza - oggi;
    return Math.round(diffMs / (1000 * 60 * 60 * 24));
  }

  function getScadenzaClass(giorniMancanti, isDone) {
    if (isDone || giorniMancanti === null) return '';
    if (giorniMancanti < 0) return 'scaduta';
    if (giorniMancanti <= GIORNI_OGGI) return 'oggi';
    if (giorniMancanti <= GIORNI_IMMINENTE) return 'imminente';
    return '';
  }

  function getScadenzaBadge(giorniMancanti, scadenza, isDone) {
    if (!scadenza) return '';

    const dataFormattata = formatDataDDMM(scadenza);
    if (!dataFormattata) return '';

    if (isDone) {
      return `<span class="due-badge normale">📅 ${dataFormattata}</span>`;
    }

    if (giorniMancanti === null) return '';

    let classe = 'normale';
    let testo = `📅 ${dataFormattata}`;

    if (giorniMancanti < 0) {
      classe = 'scaduta';
      testo = `🚨 SCADUTA (${Math.abs(giorniMancanti)}g fa) - ${dataFormattata}`;
    } else if (giorniMancanti === 0) {
      classe = 'oggi';
      testo = `⏰ OGGI - ${dataFormattata}`;
    } else if (giorniMancanti === 1) {
      classe = 'oggi';
      testo = `⏰ DOMANI - ${dataFormattata}`;
    } else if (giorniMancanti <= GIORNI_IMMINENTE) {
      classe = 'imminente';
      testo = `⚠️ ${giorniMancanti}g - ${dataFormattata}`;
    } else {
      testo = `📅 ${dataFormattata} (${giorniMancanti}g)`;
    }

    return `<span class="due-badge ${classe}">${testo}</span>`;
  }

  async function loadTasks() {
    if (isUpdating) return;

    try {
      const res = await fetch(API_URL);
      const json = await res.json();
      if (json.status === 'ok') {
        console.log('✅ Dati ricevuti:', json.data);
        renderBoard(json.data);
        updateWeekStats(json.data);
        updateAlerts(json.data);
        updateDiveDeep(json.data);
      } else {
        showError('Errore: ' + json.message);
      }
    } catch (err) {
      showError('Errore caricamento: ' + err.message);
    }
  }

  // 📊 Aggiorna i chip "Aperte" e "Completate" nella week bar
  function updateWeekStats(tasks) {
    let aperte = 0, completate = 0;

    tasks.forEach(t => {
      const isDone = t.Stato === true || t.Stato === 'TRUE' || 
                     t.Stato === 'VERO' || t.Stato === 1;
      if (isDone) completate++;
      else aperte++;
    });

    document.getElementById('statAperte').textContent = aperte;
    document.getElementById('statCompletate').textContent = completate;
  }

  // 🚨 Aggiorna alert cards (scadute/oggi/imminenti) - visibili solo se > 0
  function updateAlerts(tasks) {
    const alerts = document.getElementById('alerts');

    let scadute = 0, imminenti = 0, oggi = 0;

    tasks.forEach(t => {
      const isDone = t.Stato === true || t.Stato === 'TRUE' || 
                     t.Stato === 'VERO' || t.Stato === 1;
      if (isDone) return;

      const giorni = calcolaGiorniMancanti(t.Scadenza);
      if (giorni === null) return;

      if (giorni < 0) scadute++;
      else if (giorni <= GIORNI_OGGI) oggi++;
      else if (giorni <= GIORNI_IMMINENTE) imminenti++;
    });

    let html = '';
    if (scadute > 0) {
      html += `<div class="alert-card critical">
        🚨 <span class="alert-count">${scadute}</span> Scadute
      </div>`;
    }
    if (oggi > 0) {
      html += `<div class="alert-card critical">
        ⏰ <span class="alert-count">${oggi}</span> Oggi/Domani
      </div>`;
    }
    if (imminenti > 0) {
      html += `<div class="alert-card warning">
        ⚠️ <span class="alert-count">${imminenti}</span> Imminenti (${GIORNI_IMMINENTE}g)
      </div>`;
    }

    alerts.innerHTML = html;
  }

  // 🔴 Aggiorna banda "Dive Deep WK precedente"
  // Nuova logica: legge da StoricoScadute (auto-popolato da Apps Script)
  function updateDiveDeep(tasks) {
    const bar = document.getElementById('diveDeepBar');
    const title = document.getElementById('diveDeepTitle');
    const tasksContainer = document.getElementById('diveDeepTasks');

    const now = new Date();
    const currentWK = getWeekNumber(now);
    const previousWK = currentWK - 1;

    // Filtra task: StoricoScadute contiene WK precedente AND non completate
    const scaduteWKPrecedente = tasks.filter(t => {
      const isDone = t.Stato === true || t.Stato === 'TRUE' || 
                     t.Stato === 'VERO' || t.Stato === 1;
      if (isDone) return false;

      const storico = String(t.StoricoScadute || '').trim();
      if (!storico) return false;

      const wks = storico
        .split(',')
        .map(s => parseInt(s.trim()))
        .filter(n => !isNaN(n));

      return wks.includes(previousWK);
    });

    if (scaduteWKPrecedente.length === 0) {
      bar.classList.remove('visible');
      return;
    }

    bar.classList.add('visible');
    title.textContent = `⚠️ Dive Deep WK ${previousWK} - ${scaduteWKPrecedente.length} ${scaduteWKPrecedente.length === 1 ? 'task non completata' : 'task non completate'}:`;

    const tasksHTML = scaduteWKPrecedente.map(t => {
      const taskName = t.Task || 'Senza nome';
      const owner = t.Assegnato || 'N/A';
      return `<span class="dive-deep-task-item">${taskName}<span class="owner">(${owner})</span></span>`;
    }).join(' ');

    tasksContainer.innerHTML = tasksHTML;
  }

  function renderBoard(tasks) {
    document.getElementById('status').textContent = '';
    const board = document.getElementById('board');
    board.innerHTML = '';

    if (!tasks || tasks.length === 0) {
      board.innerHTML = '<div class="loading">📭 Nessuna task trovata nel Sheet</div>';
      return;
    }

    const categorie = {};
    tasks.forEach(t => {
      const cat = t.Categoria || 'Altro';
      if (!categorie[cat]) categorie[cat] = [];
      categorie[cat].push(t);
    });

    Object.keys(categorie).sort().forEach(cat => {
      const div = document.createElement('div');
      div.className = 'category';
      div.innerHTML = `<h2>${cat}</h2>`;

      categorie[cat]
        .sort((a, b) => {
          const giorniA = calcolaGiorniMancanti(a.Scadenza);
          const giorniB = calcolaGiorniMancanti(b.Scadenza);

          const isDoneA = a.Stato === true || a.Stato === 'TRUE' || a.Stato === 'VERO';
          const isDoneB = b.Stato === true || b.Stato === 'TRUE' || b.Stato === 'VERO';

          if (isDoneA !== isDoneB) return isDoneA ? 1 : -1;

          if (giorniA === null && giorniB !== null) return 1;
          if (giorniA !== null && giorniB === null) return -1;

          if (giorniA !== null && giorniB !== null) {
            return giorniA - giorniB;
          }

          return 0;
        })
        .forEach(t => {
          const isDone = t.Stato === true 
                      || t.Stato === 'TRUE' 
                      || t.Stato === 'VERO'
                      || t.Stato === 'Completato'
                      || t.Stato === 1
                      || String(t.Stato).toLowerCase() === 'true'
                      || String(t.Stato).toLowerCase() === 'vero';

          const cadenza = t.Cadenza || t.Livello || '';
          const cadenzaClass = getCadenzaClass(cadenza);

          const taskText = t.Task || 'Senza descrizione';
          const assegnato = t.Assegnato || 'Non assegnato';

          const giorniMancanti = calcolaGiorniMancanti(t.Scadenza);
          const scadenzaClass = getScadenzaClass(giorniMancanti, isDone);
          const scadenzaBadge = getScadenzaBadge(giorniMancanti, t.Scadenza, isDone);

          const taskEl = document.createElement('div');
          taskEl.className = `task ${isDone ? 'done' : ''} ${scadenzaClass}`;
          taskEl.dataset.taskId = t.ID;
          taskEl.innerHTML = `
            <input type="checkbox" class="checkbox" ${isDone ? 'checked' : ''} 
                   onchange="toggleTask(${t.ID}, this.checked, this)">
            <div class="task-info">
              <div><strong>${taskText}</strong><span class="saving-indicator" style="display:none">💾 Salvataggio...</span></div>
              <div class="task-meta">
                <span>👤 ${assegnato}</span>
                ${cadenza ? `<span class="cadenza-badge ${cadenzaClass}">🔄 ${cadenza}</span>` : ''}
                ${scadenzaBadge}
              </div>
            </div>
          `;
          div.appendChild(taskEl);
        });
      board.appendChild(div);
    });
  }

  async function toggleTask(id, completed, checkbox) {
    isUpdating = true;
    checkbox.disabled = true;

    const savingIndicator = checkbox.parentElement.querySelector('.saving-indicator');
    if (savingIndicator) savingIndicator.style.display = 'inline';

    try {
      const response = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ id: id, completed: completed })
      });

      const result = await response.json();
      console.log('✅ Risposta update:', result);

      if (result.status === 'ok') {
        const taskEl = checkbox.closest('.task');
        if (completed) {
          taskEl.classList.add('done');
          taskEl.classList.remove('scaduta', 'imminente', 'oggi');
        } else {
          taskEl.classList.remove('done');
        }
        setTimeout(loadTasks, 1000);
      } else {
        showError('Errore aggiornamento: ' + result.message);
        checkbox.checked = !completed;
      }
    } catch (err) {
      console.error('❌ Errore:', err);
      showError('Errore aggiornamento: ' + err.message);
      checkbox.checked = !completed;
    } finally {
      checkbox.disabled = false;
      if (savingIndicator) savingIndicator.style.display = 'none';
      isUpdating = false;
    }
  }

  function showError(msg) {
    document.getElementById('status').textContent = msg;
    setTimeout(() => {
      document.getElementById('status').textContent = '';
    }, 5000);
  }

  initTheme();
  loadTasks();
  setInterval(loadTasks, AUTO_REFRESH_MS);
</script>
